<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f5f3" id="themeColorMeta">
    <title>Zero Arcade — Player Access</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="login-page">
        <header class="arcade-header">
            <div class="brand">
                <span class="brand-name">zero</span>
                <span class="brand-label">ARCADE</span>
            </div>

            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode">
                    <span class="theme-toggle-icon" id="themeToggleIcon">&#9790;</span>
                </button>

                <span class="status">ACCESS</span>
            </div>
        </header>

        <section class="login-card" aria-label="Zero Arcade Player Access">
            <div class="login-top">
                <span class="login-category">PLAYER ACCESS</span>
                <span class="login-count">00 / 07</span>
            </div>

            <div class="login-content">
                <div class="login-heading">
                    <span class="login-number">00</span>

                    <div class="login-heading-copy">
                        <h1>Welcome back.</h1>
                        <p>Sign in to continue to the arcade.</p>
                    </div>
                </div>

                <form class="login-form" id="loginForm" autocomplete="on">
                    <div class="field-group">
                        <label for="email">EMAIL</label>
                        <input
                            id="email"
                            name="email"
                            type="email"
                            value="player@zeroarcade.com"
                            autocomplete="username"
                            spellcheck="false"
                            required
                        >
                    </div>

                    <div class="field-group">
                        <label for="password">PASSWORD</label>

                        <div class="password-field">
                            <input
                                id="password"
                                name="password"
                                type="password"
                                value="zero123"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                class="password-toggle"
                                id="passwordToggle"
                                type="button"
                                aria-label="Show password"
                                aria-pressed="false"
                            >
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                                    <circle cx="12" cy="12" r="2.7"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button class="login-button" id="loginButton" type="submit">
                        <span class="login-button-text">LOGIN</span>
                        <span class="login-button-arrow" aria-hidden="true">↗</span>
                    </button>

                    <p class="login-message" id="loginMessage" aria-live="polite"></p>
                </form>
            </div>
        </section>

        <footer class="arcade-footer">
            <span>ZERO ARCADE</span>
            <span class="watermark">PLAYER ACCESS</span>
        </footer>
    </main>

    <script src="../script.js"></script>
    <script src="login.js"></script>
</body>
</html>
